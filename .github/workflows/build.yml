name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project zip files (if the zip was uploaded as is)
        run: |
          n=0
          find . -iname '*.zip' -not -path './.git/*' -not -path './_proj/*' | while read -r z; do
            n=$((n+1))
            echo "Unzipping $z"
            mkdir -p "_proj/$n"
            unzip -q -o "$z" -d "_proj/$n"
          done

      - name: Find Android project folder
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | sort | head -1)
          if [ -z "$f" ]; then
            echo "ERROR: settings.gradle not found in the repo. Upload the project files (settings.gradle, app/, ...) to the repo."
            ls -R | head -50
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Internet-service-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
