name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzips the uploaded zip if there is one)
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
          fi
          SETTINGS=$(find . -name 'settings.gradle.kts' -not -path './.git/*' | head -1)
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Internet-service-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
